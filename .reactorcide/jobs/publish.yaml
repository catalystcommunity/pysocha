name: pysocha-publish-pypi
triggers:
  events: [tag_created]
  branches: ["v*"]
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command 'bash /job/ci/.reactorcide/scripts/publish.sh'"
  working_dir: /job
  timeout: 1800
  disable_run_local: true
environment:
  UV_PUBLISH_TOKEN: "${secret:pysocha/pypi:reactorcide_publish_pysocha}"
